<!doctype html>
<title>NIFTY Decision Dashboard — Sign in</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0a0e0c;
    --surface: #10201660;
    --panel: #0f1512;
    --border: #223028;
    --text-primary: #e6f2ea;
    --text-secondary: #8fa89a;
    --text-muted: #5c7268;
    --accent: #33d17a;
    --bad: #e5534b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--text-primary);
    font-family: "SF Mono", "Cascadia Code", "Consolas", ui-monospace, monospace;
  }
  .card {
    width: 100%;
    max-width: 320px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 28px 26px;
    margin: 20px;
  }
  .eyebrow { font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-muted); }
  h1 { font-size: 18px; font-weight: 700; margin: 4px 0 20px; }
  label { display: block; font-size: 12px; font-weight: 600; color: var(--text-secondary); margin-bottom: 6px; }
  input[type="password"] {
    width: 100%;
    background: #0a120e;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px 12px;
    font-size: 14px;
    font-family: inherit;
    color: var(--text-primary);
    margin-bottom: 14px;
  }
  input[type="password"]:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  button {
    width: 100%;
    background: var(--accent);
    color: #06120a;
    border: none;
    border-radius: 6px;
    padding: 10px 12px;
    font-size: 14px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
  }
  button:hover { filter: brightness(1.08); }
  .error { color: var(--bad); font-size: 12.5px; font-weight: 600; margin: -6px 0 14px; }
</style>
<div class="card">
  <div class="eyebrow">NIFTY intraday decisions</div>
  <h1>Sign in</h1>
  <form method="post" action="/login">
    <!--ERROR-->
    <label for="password">Password</label>
    <input type="password" id="password" name="password" autofocus required>
    <button type="submit">Sign in</button>
  </form>
</div>
